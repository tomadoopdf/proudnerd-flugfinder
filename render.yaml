# Kostenlose Bereitstellung auf render.com (Blueprint, Gratisplan).
# Schlüssel trägst du beim Anlegen im Render-Dashboard ein; alle sind optional.
services:
  - type: web
    name: proudnerd-flugfinder
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DUFFEL_TOKEN
        sync: false
      - key: APP_TOKEN
        generateValue: true
